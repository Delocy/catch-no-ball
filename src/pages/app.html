<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Catch No Ball</title>
  <link rel="icon" href="/logo-mark.svg">
  <link rel="stylesheet" href="/client/app.css">
</head>
<body>
  <header class="top">
    <img src="/logo-mark.svg" alt="" width="28" height="28">
    <h1>Catch No Ball</h1>
    <button type="button" id="upload" class="upload">Upload audio</button>
    <button type="button" id="listen" class="listen" aria-pressed="false">Listen</button>
    <input id="upload-file" type="file" accept="audio/*,.m4a,.mp3,.wav" hidden>
  </header>
  <p id="upload-status" class="upload-status" role="status" hidden></p>
  <div id="upload-confirm" class="upload-confirm" hidden>
    <p id="upload-confirm-text"></p>
    <div class="upload-actions">
      <button type="button" id="upload-send">Send</button>
      <button type="button" id="upload-dismiss">Cancel</button>
    </div>
  </div>
  <div id="banner" class="banner" role="status" hidden>
    <p class="translating"><span class="dot" aria-hidden="true"></span><span class="translating-text">Translating</span></p>
    <p class="tell">Let the table know you're using a translator</p>
  </div>
  <p id="mic-help" class="mic-help" role="alert" hidden></p>
  <main id="cards" aria-live="polite"></main>
  <form id="typed" class="typed" autocomplete="off">
    <input id="text" type="text" name="text" placeholder="Type what you heard" maxlength="1000" aria-label="Type what you heard" enterkeyhint="send">
    <button type="submit">Send</button>
  </form>
  <script type="module" src="/client/app.js"></script>
</body>
</html>
